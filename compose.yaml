name: flowops-ai

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - flowops_internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - flowops_internal

  migrate:
    image: flowops-backend:local
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    env_file:
      - .env.docker
    command:
      - php
      - artisan
      - migrate
      - --force
      - --no-interaction
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - private_storage:/var/www/html/storage/app/private
      - application_logs:/var/www/html/storage/logs
    networks:
      - flowops_internal
    restart: "no"

  app:
    image: flowops-backend:local
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env.docker
    command:
      - php-fpm
      - -F
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - private_storage:/var/www/html/storage/app/private
      - application_logs:/var/www/html/storage/logs
    expose:
      - "9000"
    healthcheck:
      test:
        - CMD-SHELL
        - php-fpm -t
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - flowops_internal

  worker:
    image: flowops-backend:local
    restart: unless-stopped
    init: true
    env_file:
      - .env.docker
    command:
      - php
      - artisan
      - queue:work
      - database
      - --queue=security,default
      - --sleep=3
      - --tries=3
      - --backoff=5
      - --timeout=80
      - --max-time=3600
      - --no-interaction
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - private_storage:/var/www/html/storage/app/private
      - application_logs:/var/www/html/storage/logs
    stop_grace_period: 120s
    networks:
      - flowops_internal

  scheduler:
    image: flowops-backend:local
    restart: unless-stopped
    init: true
    env_file:
      - .env.docker
    command:
      - php
      - artisan
      - schedule:work
      - --no-interaction
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - private_storage:/var/www/html/storage/app/private
      - application_logs:/var/www/html/storage/logs
    networks:
      - flowops_internal

  web:
    image: flowops-web:local
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - flowops_internal

volumes:
  postgres_data:
  redis_data:
  private_storage:
  application_logs:

networks:
  flowops_internal:
    driver: bridge
