name: FlowOps CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: flowops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality and SQLite tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, intl, mbstring, pcntl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install backend dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run backend test suite
        run: php artisan test

  backend-postgres:
    name: Backend PostgreSQL integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: flowops_test
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowops -d flowops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: flowops_test
      DB_USERNAME: flowops
      DB_PASSWORD: flowops_test_password
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      IP_GEOLOCATION_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, intl, mbstring, pcntl, pdo_pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Install backend dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run PostgreSQL migrations
        run: php artisan migrate:fresh --force --no-interaction

      - name: Run tests against PostgreSQL
        run: php artisan test

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /api

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Validate production container builds
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - backend-postgres
      - frontend
      - secret-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Compose environment
        run: cp .env.docker.example .env.docker

      - name: Validate Compose configuration
        run: docker compose --env-file .env.docker config --quiet

      - name: Build production images
        run: docker compose --env-file .env.docker build app web
